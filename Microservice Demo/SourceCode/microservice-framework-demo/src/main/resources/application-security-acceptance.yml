spring:
  security:
    user:
      name: demo-user
      password: demo-pass
      roles:
        - USER

framework:
  security:
    enabled: true
    jwt:
      enabled: false
    service-identity:
      enabled: true
      service-id-header: X-Service-Id
      service-token-header: X-Service-Token
      service-token: security-acceptance-secret
      protected-paths:
        - /demo/security/internal
    cors:
      enabled: true
      allowed-origins:
        - "*"
      allowed-methods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
    path:
      permit-paths:
        - /demo/security/public
        - /actuator/**
      deny-paths:
        - /demo/security/denied

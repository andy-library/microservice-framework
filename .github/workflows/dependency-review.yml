name: Dependency Review

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main

jobs:
  dependency-review:
    name: Review Dependency Changes
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
